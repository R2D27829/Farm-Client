<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="icon" href="img/logo.png"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Помощь и частые вопросы — Farm Client</title><meta name="description" content="База знаний Farm Client: вылеты, звук, Java, лицензия, игра по сети, Linux, Android."><link rel="stylesheet" href="fc.css?v=4"><meta name="theme-color" content="#e8b04a">
<script src="fc.js?v=6"></script>
<style>.cats{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.cats button{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px}.cats button.on{background:var(--gold);color:#1a1407;border-color:var(--gold);font-weight:700}
details.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:8px}details.q summary{cursor:pointer;font-weight:700}details.q[open]{border-color:rgba(232,176,74,.45)}details.q div{color:var(--muted);margin-top:8px;font-size:14.5px;line-height:1.6}details.q code{background:#1c1f26;padding:1px 6px;border-radius:6px;color:var(--text)}details.q ol,details.q ul{padding-left:20px;margin:6px 0}</style></head><body>
<main class="wrap" style="max-width:860px">
  <h1>Помощь</h1><p class="muted">Ответы на частые вопросы. Не нашёл ответ — напиши в <a href="chat.html" style="text-decoration:underline">мессенджер</a> или в Discord-канал проекта.</p>
  <input id="q" placeholder="🔎 Поиск: вылет, звук, java, ключ…" style="width:100%;margin-top:16px">
  <div class="cats" id="cats"></div>
  <div id="list"></div>
  <p class="muted small" id="none" hidden>Ничего не нашлось. Попробуй другое слово.</p>
</main>
<script>
FC.nav('faq');
const Q = [
 ['start','Как установить Farm Client?','Windows — скачай <code>FarmClient-Setup.exe</code> со <a href="index.html#download">главной</a> и запусти (установка не нужна, это портативная версия). Linux — <code>.AppImage</code>. При первом запуске мастер настройки спросит аккаунт, тему и сколько памяти выделить.'],
 ['start','Какие версии Minecraft поддерживаются?','Мод Farm Client — 1.16.5, 1.21.4, 1.21.11 и 26.x (Fabric). На вкладке «Версии» можно поставить любую ванильную версию, Fabric, Quilt, Forge и NeoForge — но мод Farm Client ставится только на поддерживаемые.'],
 ['start','Windows (SmartScreen) ругается на файл','Лаунчер не подписан платным сертификатом. Нажми «Подробнее» → «Выполнить в любом случае». Антивирус может ругаться на портативный .exe — добавь папку в исключения.'],
 ['start','Как войти: лицензия, Ely.by или офлайн?','В настройках аккаунта: «Microsoft» — лицензия Minecraft, «Ely.by» — бесплатные скины, «Офлайн» — просто ник (для одиночной игры и пиратских серверов).'],
 ['crash','Игра вылетает при запуске','<ol><li>Открой вкладку «Консоль» — там видно последнюю ошибку.</li><li>Перед запуском лаунчер сам проверяет конфликты модов (два мода одного типа, моды не той версии) — согласись отключить лишние.</li><li>Удали недавно добавленные моды в «Моды».</li><li>Поставь профиль «Баланс» в настройках и проверь, что памяти выделено 3–6 ГБ (не больше половины ОЗУ).</li><li>Кнопка «Проверить файлы» в настройках версии перекачает повреждённые файлы.</li></ol>'],
 ['crash','Ошибка Java / «Unsupported class version»','Лаунчер сам скачивает нужную Java (8 для 1.16.5, 21 для новых). Если указал свою в настройках — сбрось на «Авто».'],
 ['crash','Мало FPS / лагает','Профиль «Слабый ПК» в настройках: снижает дальность прорисовки, частицы и включает режим экономии лаунчера. Sodium/Lithium уже стоят. Закрой браузер и Discord-оверлей, выдели 3–4 ГБ памяти.'],
 ['crash','Нет звука в игре','Проверь «Настройки → Музыка и звуки» в самой игре и микшер громкости Windows (у Java отдельный ползунок). Если звук пропал после смены наушников — перезапусти игру (OpenAL не переключает устройство на лету).'],
 ['crash','Лаунчер долго запускается или жрёт память','Включи «Режим производительности» (⚡ в заголовке) — лаунчер чистит кеш и уходит в фон, пока ты играешь. Анимации и стеклянные эффекты можно отключить в настройках оформления.'],
 ['license','Где взять ключ и что даёт лицензия?','Страница <a href="buy.html">Купить</a> — выбери тариф, оплати, и ключ придёт в кабинет. Код активации вводится в лаунчере: Настройки → Лицензия. Без ключа работают лаунчер и базовые модули.'],
 ['license','Есть ли пробный период?','Да: 3 дня бесплатно один раз на устройство — кнопка «Попробовать» в карточке лицензии в лаунчере.'],
 ['license','Реферальная программа','Пригласи друга: в <a href="account.html">кабинете</a> есть твой код. Друг вводит его у себя в течение 14 дней после регистрации — и когда он купит лицензию, тебе начислится +2 дня.'],
 ['license','Промокоды','Промокод вводится на странице <a href="buy.html">Купить</a> перед оплатой — цена пересчитается сразу.'],
 ['license','Сменил ПК — ключ не работает','Ключ привязан к устройству. Напиши администратору — перевыпустит ключ на новое устройство.'],
 ['net','Как играть с другом?','<ol><li>Оба ставите Radmin VPN (или ZeroTier/Hamachi/Tailscale) и входите в одну сеть.</li><li>Хост открывает мир: Esc → «Открыть для сети».</li><li>Друг видит мир во вкладке «Друзья → Сеть» и жмёт «Зайти».</li></ol>Также можно отправить приглашение в мир прямо в мессенджере или клановом чате — у друга появится кнопка «Зайти».'],
 ['net','Друг не видит мой мир','Проверь, что вы в одной VPN-сети и у обоих одинаковая версия игры. Разреши Java в брандмауэре Windows (частные и публичные сети). Попробуй подключиться вручную по IP:порт из VPN.'],
 ['net','Как работают кланы?','Как в Clash Royale: лидер, соруководители, старейшины и участники. Клановый чат с приглашениями в мир, просьбами о помощи, фото и голосовыми. Трофеи 🏆 — сумма часов в игре участников. Страница <a href="clans.html">Кланы</a> или в лаунчере: Друзья → Клан.'],
 ['net','Статусы друзей','Лаунчер показывает друзьям, что ты «в лаунчере», «в игре на сервере …» или «не беспокоить». Статус меняется в меню профиля.'],
 ['linux','Как запустить на Linux?','<code>chmod +x FarmClient-*.AppImage</code> и запусти. Если не стартует — поставь <code>libfuse2</code> (Ubuntu: <code>sudo apt install libfuse2</code>).'],
 ['linux','Есть ли версия для macOS?','Пока нет — нужна сборка на Mac. Лаунчер может работать через Linux-версию в виртуалке, но официально не поддерживается.'],
 ['android','Что умеет приложение для Android?','Друзья и мессенджер, уведомления о новых сообщениях и новостях, клановый чат, и кнопка «Запустить на ПК» — игра стартует на компьютере, где открыт лаунчер с тем же Farm ID.'],
 ['android','Приложение не обновляется поверх старого','В версии 1.3 сменился ключ подписи. Один раз удали старое приложение и установи новое — дальше обновления будут ставиться поверх.'],
 ['mods','Не скачиваются моды','Проверь интернет/VPN. Некоторые авторы на CurseForge запрещают скачивание из сторонних лаунчеров — такие моды открываются в браузере.'],
 ['mods','Где мои скриншоты?','В лаунчере вкладка «Скриншоты» на главной — все скрины со всех версий. Из игры можно отправить скрин другу: Farm-меню → «Отправить скрин».'],
 ['mods','Как поделиться сборкой или конфигом?','Сборка: «Версии» → ⋯ → «Поделиться» (код или файл .farmpack). Конфиги и темы — в <a href="gallery.html">Галерее</a>.'],
 ['mods','Метки (waypoints) и друзья','Метки можно отправлять друзьям: в меню меток → «Поделиться» — друг получит ссылку и метка появится у него в мире.'],
 ['acc','Что такое Farm ID / кабинет?','Аккаунт Farm Client: облачные конфиги, мессенджер, галерея, кланы и лицензия. Вход в <a href="account.html">кабинет</a> — кодом из лаунчера или через Discord/Telegram/VK.'],
 ['acc','Как получить галочку ✓?','Подай заявку в кабинете (раздел «Галочка») — администратор проверит профиль.'],
 ['acc','Где мой публичный профиль?','<a href="u.html">u.html</a> — часы в игре, клан, публикации и лайки. Ссылку можно скинуть друзьям.'],
];
const CAT = { all: 'Все', start: '🚀 Начало', crash: '💥 Вылеты и FPS', license: '🔑 Лицензия', net: '🌐 Друзья и сеть', mods: '🧩 Моды', linux: '🐧 Linux / Mac', android: '📱 Android', acc: '👤 Аккаунт' };
let cat = 'all';
const $ = (s) => document.querySelector(s);
$('#cats').innerHTML = Object.entries(CAT).map(([k, v]) => `<button data-k="${k}" class="${k === 'all' ? 'on' : ''}">${v}</button>`).join('');
function draw() {
  const q = $('#q').value.trim().toLowerCase();
  const l = Q.filter(([c, t, a]) => (cat === 'all' || c === cat) && (!q || (t + ' ' + a.replace(/<[^>]+>/g, '')).toLowerCase().includes(q)));
  $('#list').innerHTML = l.map(([c, t, a]) => `<details class="q"${q && l.length < 4 ? ' open' : ''}><summary>${t}</summary><div>${a}</div></details>`).join('');
  $('#none').hidden = !!l.length;
}
$('#cats').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; cat = b.dataset.k; document.querySelectorAll('#cats button').forEach((x) => x.classList.toggle('on', x === b)); draw(); };
$('#q').oninput = draw; draw();
</script></body></html>
