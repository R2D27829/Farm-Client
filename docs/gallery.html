<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="icon" href="img/logo.png"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Галерея — темы, конфиги и сборки Farm Client</title><link rel="stylesheet" href="fc.css?v=4"><meta name="theme-color" content="#e8b04a">
<script src="fc.js?v=6"></script>
<style>.tabs{display:flex;gap:6px;margin:18px 0}.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer;font:inherit}.tabs button.on{color:#1a1407;background:var(--gold);border-color:var(--gold);font-weight:700}
.item h3{font-size:16px;margin:6px 0 4px}.item p{color:var(--muted);font-size:13.5px;min-height:20px;white-space:pre-wrap}.item .row{margin-top:12px}.lk{background:none;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:4px 10px;cursor:pointer;font:inherit;font-size:13px}.lk.on{border-color:#e0556b;color:#ff7b8f}.cms{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;display:grid;gap:6px}.cms .c{font-size:13px}.cms .c b{color:var(--gold)}.cms .c button{background:none;border:0;color:var(--muted);cursor:pointer}.vbadge{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--gold);color:#1a1407;font-size:10px;font-weight:900;vertical-align:middle}</style></head><body>
<main class="wrap">
  <h1>Галерея</h1><p class="muted">Темы лаунчера, конфиги мода и сборки от игроков. «Открыть в лаунчере» сразу ставит выбранное.</p>
  <div class="row" style="margin-top:14px"><div class="tabs" id="tabs"><button data-k="theme" class="on">🎨 Темы</button><button data-k="config">⚙️ Конфиги</button><button data-k="pack">📦 Сборки</button></div>
    <input id="q" placeholder="Поиск…" style="flex:1;min-width:180px"><select id="sort"><option value="new">Новые</option><option value="top">🔥 Топ</option><option value="liked">❤ Любимые</option><option value="verified">✔ Проверенные</option></select></div>
  <div class="grid" id="list"></div>
  <div style="text-align:center;margin:16px 0"><button class="btn hidden" id="more">Показать ещё</button></div>
  <section class="card" id="upload">
    <h2>Опубликовать</h2>
    <div id="up-need" class="muted small">Чтобы публиковать, <a href="account.html" style="text-decoration:underline">войди в кабинет</a> кодом из лаунчера.</div>
    <form id="up-form" class="hidden" style="display:grid;gap:10px;max-width:560px">
      <select id="up-kind"><option value="theme">Тема лаунчера (.css или экспорт оформления .json)</option><option value="config">Конфиг мода (.json, .zip, бинды .txt)</option><option value="pack">Сборка (.farmpack, .mrpack, .zip)</option></select>
      <input id="up-title" placeholder="Название" maxlength="80" required>
      <textarea id="up-desc" placeholder="Описание (необязательно)" maxlength="500" rows="3"></textarea>
      <input id="up-file" type="file" required>
      <div class="row"><button class="btn gold" id="up-go">Опубликовать</button><span class="muted small">до 10 МБ</span></div>
    </form>
  </section>
</main>
<script>
FC.nav('gallery');
const $ = (s) => document.querySelector(s);
let kind = 'theme', off = 0;
const KN = { theme: 'тема', config: 'конфиг', pack: 'сборка' };
async function load(append) {
  if (!append) off = 0;
  let l = [];
  try { const so = $('#sort').value; l = await FC.api('GET', `/api/uploads?kind=${kind}&sort=${so === 'verified' ? 'top' : so}${so === 'verified' ? '&verified=1' : ''}&q=${encodeURIComponent($('#q').value.trim())}&offset=${off}`, { auth: false }); }
  catch (e) { $('#list').innerHTML = `<p class="muted">${FC.esc(e.message)}</p>`; return; }
  const html = l.map((x) => `<div class="card item" style="margin:0"><span class="tag">${KN[x.kind]}</span> <span class="muted small"><a href="u.html?id=${encodeURIComponent(x.uid || x.author || '')}" style="text-decoration:underline">${FC.esc(x.author || '')}</a>${x.verified ? ' <span class="vbadge" title="Проверенный автор">✓</span>' : ''} · ${FC.date(x.created)}</span>
    <h3>${FC.esc(x.title)}</h3><p>${FC.esc(x.descr || '')}</p>
    <div class="row"><a class="btn gold sm" href="farmclient://import?id=${encodeURIComponent(x.id)}">Открыть в лаунчере</a><a class="btn sm" href="${window.FC_API}/api/uploads/${encodeURIComponent(x.id)}/file">⬇ ${FC.size(x.size)}</a><span class="muted small">⬇ ${x.downloads}</span><button class="lk" data-like="${FC.esc(x.id)}">❤ <span>${x.likes || 0}</span></button><button class="lk" data-cm="${FC.esc(x.id)}">💬 ${x.comments || 0}</button></div><div class="cms hidden" id="cm-${FC.esc(x.id)}"></div></div>`).join('');
  $('#list').innerHTML = append ? $('#list').innerHTML + html : html || '<p class="muted">Пока пусто — опубликуй первым!</p>';
  off += l.length; $('#more').classList.toggle('hidden', l.length < 30);
}
document.querySelectorAll('#tabs button').forEach((b) => (b.onclick = () => { document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b)); kind = b.dataset.k; load(); }));
let qt; $('#q').oninput = () => { clearTimeout(qt); qt = setTimeout(() => load(), 300); };
$('#sort').onchange = () => load(); $('#more').onclick = () => load(true);
if (FC.token) { $('#up-need').classList.add('hidden'); $('#up-form').classList.remove('hidden'); }
$('#up-form').onsubmit = async (e) => {
  e.preventDefault(); const f = $('#up-file').files[0]; if (!f) return;
  if (f.size > 10 * 1024 * 1024) return FC.toast('Файл больше 10 МБ', true);
  $('#up-go').disabled = true;
  try {
    const q = new URLSearchParams({ kind: $('#up-kind').value, title: $('#up-title').value, desc: $('#up-desc').value, filename: f.name });
    await FC.api('POST', '/api/uploads?' + q, { raw: f });
    FC.toast('Опубликовано!'); $('#up-form').reset(); kind = $('#up-kind').value;
    document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x.dataset.k === kind)); load();
  } catch (err) { FC.toast(err.message, true); }
  $('#up-go').disabled = false;
};
const cmLoad = async (id) => {
  const box = document.getElementById('cm-' + id); box.classList.remove('hidden'); box.innerHTML = '<span class="muted small">Загрузка…</span>';
  try {
    const r = await FC.api('GET', `/api/uploads/${encodeURIComponent(id)}/comments`, { auth: !!FC.token });
    box.innerHTML = (r.comments.map((c) => `<div class="c"><b><a href="u.html?id=${encodeURIComponent(c.user_id)}">${FC.esc(c.name || 'игрок')}</a></b> ${FC.esc(c.text)} ${c.mine ? `<button data-del="${c.id}" data-up="${FC.esc(id)}" title="Удалить">✕</button>` : ''}</div>`).join('') || '<span class="muted small">Комментариев пока нет</span>')
      + (FC.token ? `<form class="row" data-cf="${FC.esc(id)}"><input name="t" maxlength="500" placeholder="Комментарий…" style="flex:1"><button class="btn sm">→</button></form>` : '<span class="muted small"><a href="account.html" style="text-decoration:underline">Войди</a>, чтобы комментировать</span>');
  } catch (e) { box.innerHTML = `<span class="muted small">${FC.esc(e.message)}</span>`; }
};
$('#list').addEventListener('click', async (e) => {
  const l = e.target.closest('[data-like]'), c = e.target.closest('[data-cm]'), d = e.target.closest('[data-del]');
  if (l) { if (!FC.token) return FC.toast('Войди в кабинет, чтобы ставить лайки', true); try { const r = await FC.api('POST', `/api/uploads/${encodeURIComponent(l.dataset.like)}/like`); l.classList.toggle('on', r.liked); l.querySelector('span').textContent = r.likes; } catch (er) { FC.toast(er.message, true); } }
  if (c) { const box = document.getElementById('cm-' + c.dataset.cm); if (!box.classList.contains('hidden')) box.classList.add('hidden'); else cmLoad(c.dataset.cm); }
  if (d) { try { await FC.api('DELETE', '/api/comments/' + d.dataset.del); cmLoad(d.dataset.up); } catch (er) { FC.toast(er.message, true); } }
});
$('#list').addEventListener('submit', async (e) => {
  const f = e.target.closest('[data-cf]'); if (!f) return; e.preventDefault(); const t = f.t.value.trim(); if (!t) return;
  try { await FC.api('POST', `/api/uploads/${encodeURIComponent(f.dataset.cf)}/comments`, { body: { text: t } }); cmLoad(f.dataset.cf); } catch (er) { FC.toast(er.message, true); }
});
load();
</script></body></html>
